server:
  port: 8082

spring:
  application:
    name: auth
    token-expiration-duration:  604800000 # 7 days
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
springdotenv:
  filename: ../.env

bootstrap:
  admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME}
  admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
