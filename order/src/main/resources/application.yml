server:
  port: 8083
spring:
  application:
    name: order
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
springdotenv:
  filename: ../.env
product-service:
  url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

